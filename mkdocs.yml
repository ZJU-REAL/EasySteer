site_name: EasySteer
site_description: A unified framework for high-performance and extensible LLM steering, built on vLLM.
site_url: https://zju-real.github.io/EasySteer/
repo_url: https://github.com/ZJU-REAL/EasySteer
repo_name: ZJU-REAL/EasySteer
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - navigation.instant
    - navigation.tracking
    - navigation.path
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Troubleshooting: getting-started/troubleshooting.md
  - User Guide:
      - Inference:
          - Steering requests: user-guide/steering.md
          - Attention head intervention: user-guide/attention.md
          - Graphs, caching, and performance: user-guide/performance.md
      - Extraction and Training:
          - Hidden-state capture: user-guide/hidden-state-capture.md
          - Extracting vectors: user-guide/extracting-vectors.md
          - ReFT training: user-guide/reft-training.md
      - Serving:
          - OpenAI-compatible server: user-guide/openai-server.md
          - Web demos: user-guide/web-demo.md
  - Replications:
      - replications/index.md
  - Developer Guide:
      - developer-guide/testing.md
      - developer-guide/contributing.md
  - API Reference:
      - api-reference/index.md
      - Configuration:
          - Engine arguments: api-reference/engine-configuration.md
          - Algorithms and payloads: api-reference/algorithms.md
      - Steering:
          - Specs and LLM methods: api-reference/steering-specs.md
          - Payload classes: api-reference/payloads.md
      - Capture:
          - capture() and CaptureResult: api-reference/hidden-states.md
          - vllm.capture: api-reference/capture.md
      - Extraction and Extension:
          - Vector extraction and adapters: api-reference/steer.md
          - Algorithm extension API: api-reference/algorithm-extension.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # Static analysis only (griffe reads the source; nothing is
          # imported), so `mkdocs build --strict` runs in a plain env with
          # just requirements-docs.txt — no torch/easysteer install needed.
          # Load EasySteer's fork modules and LLM additions without collecting
          # unrelated upstream model implementations or importing either package.
          paths: [., vllm-steer/vllm, vllm-steer/vllm/entrypoints]
          options:
            allow_inspection: false
            extensions:
              - griffe_pydantic:
                  schema: false
            docstring_style: google
            show_source: true
            show_root_heading: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

extra:
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ZJU-REAL/EasySteer
    - icon: fontawesome/solid/paper-plane
      link: https://arxiv.org/abs/2509.25175

# Only the docs/ tree is published; the top-level READMEs stay the GitHub landing page.
# This README describes how to maintain the documentation site.
exclude_docs: |
  README.md
